[pytest]
DJANGO_SETTINGS_MODULE = src.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers --verbose --cov=src --cov-report=html --cov-report=term-missing
testpaths = tests

markers =
    django_db: marks tests as requiring the database (deselect with '-m "not django_db"')
    slow: marks tests as slow (deselect with '-m "not slow"')
